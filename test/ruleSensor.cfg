# ==============================
# RULE CONFIGURATION FILE
# Gateway Simple Rule Engine
# ==============================

[RULE_OVER_TEMPERATURE]
SENSOR=TEMP
MODE=AVG
WINDOW=3
STATEFUL=YES
PERSIST_COUNT=3
CONDITION=AVG >= 4.0
ACTION=LOG,ALERT
MESSAGE=Over temperature detected

[RULE_HUMIDITY_OUT_OF_RANGE]
SENSOR=HUMI
MODE=AVG
WINDOW=3
STATEFUL=NO
CONDITION=AVG < 3.0 OR AVG > 8.0
ACTION=LOG
MESSAGE=Humidity out of range

[RULE_LOW_LIGHT_DAYTIME]
SENSOR=LIGHT
MODE=AVG
WINDOW=3
STATEFUL=NO
TIME_RANGE=06:00-18:00
CONDITION=AVG < 50
ACTION=LOG
MESSAGE=Low light during daytime

[RULE_PRESSURE_DROP]
SENSOR=PRESS
MODE=AVG
WINDOW=3
STATEFUL=NO
CONDITION=AVG < 950
ACTION=LOG
MESSAGE=Pressure drop detected

[RULE_OVERCURRENT]
SENSOR=POWER_CURRENT
MODE=INSTANT
STATEFUL=NO
CONDITION=VALUE > 2.0
ACTION=LOG,SHUTDOWN
MESSAGE=Overcurrent detected

[RULE_LOW_VOLTAGE]
SENSOR=POWER_VOLTAGE
MODE=AVG
WINDOW=3
STATEFUL=YES
LOW_THRESHOLD=11.0
RECOVER_THRESHOLD=11.5
ACTION=LOG
MESSAGE=Low voltage detected

[RULE_SHOCK_DETECTION]
SENSOR=ACCEL
MODE=INSTANT
STATEFUL=NO
CONDITION=MAGNITUDE > 2.5
ACTION=LOG,ALERT
MESSAGE=Shock detected

[RULE_FIRE_RISK]
SENSOR=COMPOSITE
MODE=AVG
WINDOW=3
STATEFUL=NO
CONDITION=TEMP_AVG > 4.5 AND HUMI_AVG < 3.0 AND LIGHT_AVG > 400
ACTION=LOG,ALERT
MESSAGE=Fire risk detected

# ==============================
# END OF FILE
# ==============================
