# ==============================
# RULE CONFIGURATION FILE
# Gateway Simple Rule Engine
# ==============================

[RULE_OVER_TEMPERATURE]
SENSOR=TEMP
MODE=AVG
WINDOW=3
STATEFUL=YES
PERSIST_COUNT=3
CONDITION=AVG >= 4.0
ACTION=LOG,ALERT
MESSAGE=Over temperature detected

[RULE_HUMIDITY_OUT_OF_RANGE]
SENSOR=HUMI
MODE=AVG
WINDOW=3
STATEFUL=NO
CONDITION=AVG < 3.0 OR AVG > 8.0
ACTION=LOG
MESSAGE=Humidity out of range

[RULE_LOW_LIGHT_DAYTIME]
SENSOR=LIGHT
MODE=AVG
WINDOW=3
STATEFUL=NO
CONDITION=AVG < 50
ACTION=LOG
MESSAGE=Low light

[RULE_PRESSURE_DROP]
SENSOR=PRESS
MODE=AVG
WINDOW=3
STATEFUL=NO
CONDITION=AVG < 950
ACTION=LOG
MESSAGE=Pressure drop detected

[RULE_OVERCURRENT]
SENSOR=POWER_CURRENT
MODE=INSTANT
STATEFUL=NO
CONDITION=VALUE > 2.0
ACTION=LOG,SHUTDOWN
MESSAGE=Overcurrent detected

[RULE_LOW_VOLTAGE]
SENSOR=POWER_VOLTAGE
MODE=AVG
WINDOW=3
STATEFUL=YES
PERSIST_COUNT=2
CONDITION=AVG < 11.0 OR AVG > 11.5
ACTION=LOG
MESSAGE=Low voltage detected

# ==============================
# END OF FILE
# ==============================
